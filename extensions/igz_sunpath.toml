[description]
es = "Añade a IngeTrazo una barra Sun Path completa: interruptor de sombras, brújula en pantalla con deslizadores de fecha y hora, vector solar 3D, cúpula solar 3D con arcos mensuales, analemas y celdas clicables; diálogo Ajustar Sol con rotación del norte y localización integrada en el panel Terreno; exportación PNG con fondo blanco o transparente. El estado se guarda en el modelo y sobrevive a guardar y reabrir el .igz. Interfaz en 7 idiomas."
en = "Adds a complete Sun Path toolbar to IngeTrazo: shadow toggle, on-screen compass with date and time sliders, 3D sun vector, 3D solar dome with monthly arcs, analemmas and clickable cells; a Set Sun dialog with north rotation and a location box integrated with the Terreno panel; and PNG export with a white or transparent background. State is stored in the document and survives saving and reopening the .igz. UI in 7 languages."
pt = "Adiciona ao IngeTrazo uma barra Sun Path completa: botão de sombras, bússola em tela com sliders de data e hora, vetor solar 3D, domo solar 3D com arcos mensais, analemas e células clicáveis; diálogo Ajustar Sol com rotação do norte e localização integrada ao painel Terreno; e exportação PNG com fundo branco ou transparente. O estado fica no documento e sobrevive a salvar e reabrir o .igz. Interface em 7 idiomas."
